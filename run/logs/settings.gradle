// ============================================================================
// IMPORTANT: ASCII-safe Gradle home.
// The default C:\Users\<cyrillic-name>\.gradle breaks ModLauncher's module
// resolution ("Module fml_earlydisplay reads more than one module named
// fml_loader") because non-ASCII paths corrupt the union/classpath handling.
// Override with:  -PgradleHome=D:/other/path   or env GRADLE_USER_HOME.
// ============================================================================
def asciiGradleHome = providers.gradleProperty('gradleHome')
        .orElse(System.getenv('GRADLE_USER_HOME'))
        .getOrElse('C:/.gradle-autociv')

gradle.startParameter.setGradleUserHomeDir(new File(asciiGradleHome))

buildCache {
    local {
        directory = new File(asciiGradleHome, 'build-cache')
    }
}

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'autonomous-civilizations'
